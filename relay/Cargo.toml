[package]
name = "nostr-rs-relay"
version = "0.10.0"
edition = "2021"
authors = ["A4A Network <noreply@a4a.network>"]
description = "High-performance Rust relay node for the A4A (Agent for Agent) protocol"
readme = "README.md"
homepage = "https://a4a.network"
repository = "https://github.com/a4a-network/a4a"
license = "MIT"
keywords = ["a4a", "agents", "relay", "server"]
categories = ["network-programming", "web-programming"]
default-run = "nostr-rs-relay"

[dependencies]
clap = { version = "4.0.32", features = ["env", "default", "derive"]}
tracing = "0.1.37"
tracing-appender = "0.2.2"
tracing-subscriber = "0.3.16"
tokio = { version = "1", features = ["full", "tracing", "signal"] }
prost = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
console-subscriber = "0.4"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.27"
tungstenite = "0.27"
thiserror = "1"
uuid = { version = "1.1.2", features = ["v4"] }
config = { version = "0.15", features = ["toml"] }
bitcoin_hashes = { version = "0.14", features = ["serde"] }
secp256k1 = { version = "0.30", features = ["rand", "serde", "hashes", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = {version = "1.0", features = ["preserve_order"]}
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.39", features = ["limits","bundled","modern_sqlite", "trace", "hooks"]}
r2d2 = "0.8"
r2d2_sqlite = "0.34"
scheduled-thread-pool = "0.2.7"
lazy_static = "1.4"
governor = "0.10"
nonzero_ext = "0.3"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1.11.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio"] }
# rustls 0.23 enables aws-lc-rs by default while this project explicitly enables ring.
# With TWO crypto providers in the graph, rustls cannot choose and panics on the first
# TLS connection. Keep exactly one provider (review R7, 2026-08-28).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
http = { version = "1" }
humantime = "2"
rand = "0.8"
const_format = "0.2.28"
regex = "1"
async-trait = "0.1.60"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "macros"]}
chrono = "0.4.23"
prometheus = "0.14"
indicatif = "0.18.6"
bech32 = "0.9.1"
url = "2.3.1"
log = "0.4"
itertools = "0.14.0"

[target.'cfg(all(not(target_env = "msvc"), not(target_os = "openbsd")))'.dependencies]
tikv-jemallocator = "0.5"

[dev-dependencies]
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14.6"

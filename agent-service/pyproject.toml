[project]
name = "a4a-project-agent"
version = "0.1.0"
description = "A4A project agent: a public protocol address instead of an inbox"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "a4a", "protocol", "ai-agents"]
dependencies = ["a4a-sdk", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a4a_agent", "a4a_agent.*"]

[project.urls]
Source = "https://github.com/a4a-network/a4a"
Issues = "https://github.com/a4a-network/a4a/issues"

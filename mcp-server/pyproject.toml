[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a4a-mcp"
version = "0.4.0"
description = "A4A MCP server for connecting external agents to the A4A protocol"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "a4a", "protocol", "ai-agents"]
dependencies = [
  "a4a-sdk>=0.4.0",
  "mcp>=1.28.1",
  # Enforce the security floor even when a consumer reuses an older MCP graph.
  "PyJWT>=2.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# Optional adapter profiles.
#
# Base dependencies intentionally use broad ranges: a library that dictates exact
# versions conflicts with otherwise compatible consumer applications.
#
# The two adapters are tested on exact transport versions and reject other
# versions. This is a security boundary: silently accepting an untested version
# could allow credential proxying or redirection. Because the base range is wider
# than adapter support, a clean base installation may select a newer version that
# the adapter rejects. Consumers that need an adapter must install its profile.
#
# A profile selects dependencies; it does not enable the adapter, create keys,
# issue a mandate, or change configuration. An explicitly enabled adapter works
# without the profile when the installed versions match. It rejects unsupported
# versions, not the absence of a profile.
channel = ["mcp==1.28.1"]
# The public profile name describes a capability, not its consumer. A dedicated
# test keeps owner project names out of public onboarding documentation.
host-signal = ["websockets==13.1"]

[tool.uv.sources]
a4a-sdk = { path = "../sdk-python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "requires_channel: positive channel-adapter test; requires the `channel` profile",
  "requires_host_signal: positive host-signal test; requires the `host-signal` profile",
]

[tool.hatch.build.targets.wheel]
packages = ["a4a_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
a4a-mcp = "a4a_mcp.__main__:cli_main"

[project.urls]
Source = "https://github.com/a4a-network/a4a"
Issues = "https://github.com/a4a-network/a4a/issues"
